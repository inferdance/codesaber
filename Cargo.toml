[workspace]
resolver = "3"
members = [
    "crates/saber-protocol",
    "crates/saber-core",
    "crates/saber-tools",
    "crates/saber-provider",
    "crates/saber-sandbox",
    "crates/saber-jobs",
    "crates/saber-mcp",
    "crates/saber-server",
    "crates/saber-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/inferdance/codesaber"

[workspace.dependencies]
# Workspace-level dependency table grows with each M0 task (deps are added
# when code actually uses them — cargo-shear enforces this in CI).
saber-protocol = { path = "crates/saber-protocol", version = "0.1.0" }
saber-core = { path = "crates/saber-core", version = "0.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
insta = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
