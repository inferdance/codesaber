[workspace]
resolver = "3"
members = [
    "crates/saber-protocol",
    "crates/saber-core",
    "crates/saber-tools",
    "crates/saber-provider",
    "crates/saber-sandbox",
    "crates/saber-jobs",
    "crates/saber-mcp",
    "crates/saber-server",
    "crates/saber-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/inferdance/codesaber"

[workspace.dependencies]
# Workspace-level dependency table grows with each M0 task (deps are added
# when code actually uses them — cargo-shear enforces this in CI).
saber-protocol = { path = "crates/saber-protocol", version = "0.1.0" }
saber-core = { path = "crates/saber-core", version = "0.1.0" }
saber-tools = { path = "crates/saber-tools", version = "0.1.0" }
saber-provider = { path = "crates/saber-provider", version = "0.1.0" }
saber-sandbox = { path = "crates/saber-sandbox", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
insta = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
wiremock = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
grep = "0.3"
ignore = "0.4"
globset = "0.4"
walkdir = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
