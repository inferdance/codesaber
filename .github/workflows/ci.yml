name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: docs lint (placeholder until TS workspace lands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs exist
        run: |
          test -f README.md
          test -f LICENSE
          test -f AGENTS.md
          test -d docs/superpowers/specs

