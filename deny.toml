# cargo-deny configuration: single quality gate for advisories / bans / licenses / sources.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
version = 2
# Codesaber is Apache-2.0; permissive deps only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # Permissive data license carried by some reqwest 0.13 transitive deps.
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "warn"
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
